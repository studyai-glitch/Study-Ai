<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        darkBg: '#131314',
                        darkSidebar: '#1e1f20',
                        geminiBlue: '#4285f4',
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(90deg, #4b90ff, #ff5546);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-gradient {
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="bg-white text-gray-800 dark:bg-darkBg dark:text-gray-100 h-screen flex overflow-hidden transition-colors duration-300">

    <aside id="sidebar" class="w-72 bg-[#f0f4f9] dark:bg-darkSidebar h-full flex flex-col transition-all duration-300 z-20 absolute md:relative -translate-x-full md:translate-x-0">
        <div class="p-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg logo-gradient flex items-center justify-center text-white font-bold text-sm">SA</div>
                <span class="font-semibold text-lg">Study Ai Menu</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden p-1.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="px-4 py-2">
            <button onclick="startNewChat()" class="w-full py-3 px-4 bg-gray-200/70 dark:bg-gray-700/50 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full flex items-center gap-3 font-medium text-sm transition-all">
                <span class="material-symbols-outlined text-xl">add</span>
                New Chat
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-2 py-2 space-y-1" id="chat-history-list"></div>

        <div class="p-4 border-t border-gray-200 dark:border-gray-700 space-y-1">
            <button onclick="openSettings()" class="w-full p-2.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl flex items-center gap-3 text-sm font-medium">
                <span class="material-symbols-outlined text-xl text-gray-500 dark:text-gray-400">settings</span>
                Settings
            </button>
            <button onclick="toggleDarkMode()" class="w-full p-2.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl flex items-center gap-3 text-sm font-medium">
                <span class="material-symbols-outlined text-xl text-gray-500 dark:text-gray-400" id="theme-icon">dark_mode</span>
                <span id="theme-text">Dark Mode</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-white dark:bg-darkBg">
        <header class="h-16 border-b border-gray-100 dark:border-gray-800/50 flex items-center justify-between px-4 z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="text-xl font-medium tracking-tight">Study <span class="text-red-500 font-semibold">Ai</span></h1>
            </div>
            <div id="connection-badge" class="px-3 py-1 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 rounded-full text-xs font-medium flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                DeepSeek Flash Ready
            </div>
        </header>

        <div class="flex-1 overflow-y-auto" id="chat-scroll-container">
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center p-6 text-center max-w-xl mx-auto space-y-6">
                <div class="w-16 h-16 rounded-2xl logo-gradient flex items-center justify-center text-white text-3xl shadow-lg shadow-indigo-500/10">
                    <span class="material-symbols-outlined text-4xl">school</span>
                </div>
                <div class="space-y-2">
                    <h2 class="text-3xl md:text-4xl font-semibold tracking-tight">Hello, <span class="gradient-text font-bold">User</span></h2>
                    <p class="text-gray-500 dark:text-gray-400 text-base">How can I help you today?</p>
                </div>
            </div>

            <div id="chat-screen" class="hidden-view max-w-3xl mx-auto px-4 py-6 space-y-6"></div>
        </div>

        <footer class="p-4 bg-gradient-to-t from-white via-white to-transparent dark:from-darkBg dark:via-darkBg">
            <div class="max-w-3xl mx-auto">
                <form id="chat-form" onsubmit="handleChatSubmit(event)" class="relative flex items-center bg-[#f0f4f9] dark:bg-darkSidebar rounded-2xl p-2 focus-within:ring-2 focus-within:ring-geminiBlue/50 transition-all">
                    <input type="text" id="user-input" placeholder="Ask Study Ai (DeepSeek)..." autocomplete="off" class="w-full py-3 px-4 bg-transparent outline-none text-base text-gray-900 dark:text-gray-100 placeholder-gray-500">
                    <button type="submit" id="send-btn" class="p-3 bg-geminiBlue hover:bg-blue-600 text-white rounded-xl flex items-center justify-center transition-all disabled:opacity-50">
                        <span class="material-symbols-outlined text-xl">send</span>
                    </button>
                </form>
                <p class="text-center text-xs text-gray-400 mt-2">Ai can make mistakes. Check important info.</p>
            </div>
        </footer>
    </main>

    <div id="settings-modal" class="hidden-view fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-darkSidebar rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-gray-100 dark:border-gray-800">
            <div class="p-6 flex items-center justify-between border-b border-gray-100 dark:border-gray-800">
                <h3 class="text-xl font-semibold">Settings</h3>
                <button onclick="closeSettings()" class="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">OpenRouter API Key</label>
                    <input type="password" id="settings-api-key" placeholder="sk-or-v1-..." class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent outline-none focus:border-geminiBlue transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Model Status</label>
                    <input type="text" id="settings-model-name" readonly value="deepseek/deepseek-flash:free" class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-100 dark:bg-gray-900 text-gray-500 outline-none text-sm font-mono cursor-not-allowed">
                    <p class="text-[11px] text-green-600 mt-1">✓ DeepSeek Flash Free default lock kar diya gaya hai.</p>
                </div>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-black/20 flex justify-end gap-2">
                <button onclick="closeSettings()" class="px-4 py-2 text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl transition-all">Cancel</button>
                <button onclick="saveSettings()" class="px-5 py-2 text-sm font-medium bg-geminiBlue hover:bg-blue-600 text-white rounded-xl transition-all shadow-md">Save Details</button>
            </div>
        </div>
    </div>

    <script>
        let conversations = JSON.parse(localStorage.getItem('study_ai_convos')) || [];
        let currentConvoId = localStorage.getItem('study_ai_current_id') || null;
        let config = JSON.parse(localStorage.getItem('study_ai_config')) || { apiKey: '', model: 'deepseek/deepseek-flash:free' };

        // Always force the correct model string to avoid dot errors
        config.model = 'deepseek/deepseek-flash:free';
        localStorage.setItem('study_ai_config', JSON.stringify(config));

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('study_ai_theme') === 'dark' || (!('study_ai_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeUI(false);
            }
            renderSidebarHistory();
            if (currentConvoId) { loadConversation(currentConvoId); } else { showWelcomeScreen(); }
        });

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('study_ai_theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }
        function updateThemeUI(isDark) {
            document.getElementById('theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
            document.getElementById('theme-text').textContent = isDark ? 'Light Mode' : 'Dark Mode';
        }
        function openSettings() {
            document.getElementById('settings-api-key').value = config.apiKey || '';
            document.getElementById('settings-modal').classList.remove('hidden-view');
        }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden-view'); }
        function saveSettings() {
            config.apiKey = document.getElementById('settings-api-key').value.trim();
            localStorage.setItem('study_ai_config', JSON.stringify(config));
            closeSettings();
            if (currentConvoId) loadConversation(currentConvoId);
        }
        function startNewChat() {
            currentConvoId = 'convo_' + Date.now();
            localStorage.setItem('study_ai_current_id', currentConvoId);
            showWelcomeScreen();
            if (window.innerWidth < 768) toggleSidebar();
        }
        function showWelcomeScreen() {
            document.getElementById('welcome-screen').classList.remove('hidden-view');
            document.getElementById('chat-screen').classList.add('hidden-view');
        }
        function renderSidebarHistory() {
            const container = document.getElementById('chat-history-list');
            container.innerHTML = conversations.length === 0 ? `<div class="text-xs text-gray-400 text-center py-8">No recent chats</div>` : '';
            conversations.slice().reverse().forEach(convo => {
                const btn = document.createElement('button');
                btn.className = `w-full p-3 text-left text-sm rounded-xl flex items-center gap-3 transition-all truncate ${convo.id === currentConvoId ? 'bg-gray-200 dark:bg-gray-700 font-medium' : 'hover:bg-gray-100 dark:hover:bg-gray-800/60'}`;
                btn.onclick = () => {
                    currentConvoId = convo.id;
                    localStorage.setItem('study_ai_current_id', convo.id);
                    loadConversation(convo.id);
                    if (window.innerWidth < 768) toggleSidebar();
                };
                btn.innerHTML = `<span class="material-symbols-outlined text-lg text-gray-400">chat_bubble</span><span class="truncate flex-1">${convo.title}</span>`;
                container.appendChild(btn);
            });
        }
        function loadConversation(id) {
            const convo = conversations.find(c => c.id === id);
            if (!convo) { startNewChat(); return; }
            document.getElementById('welcome-screen').classList.add('hidden-view');
            const screen = document.getElementById('chat-screen');
            screen.classList.remove('hidden-view');
            screen.innerHTML = '';
            convo.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
            scrollToBottom();
        }
        function appendMessageUI(role, text) {
            const screen = document.getElementById('chat-screen');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in duration-200`;
            const isSystemAlert = text.startsWith('⚠️ System Alert:');
            
            let bubbleStyle = role === 'user' 
                ? 'bg-[#f0f4f9] dark:bg-darkSidebar text-gray-900 dark:text-gray-100 rounded-2xl px-4 py-2.5 max-w-[85%] break-words'
                : (isSystemAlert ? 'bg-red-50 text-red-800 dark:bg-red-950/30 dark:text-red-300 border border-red-100 dark:border-red-900/50 rounded-2xl px-5 py-4 w-full' : 'text-gray-800 dark:text-gray-200 px-1 py-2 max-w-full w-full break-words');

            let avatarHtml = role === 'assistant' 
                ? (isSystemAlert ? `<div class="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/50 flex items-center justify-center text-red-600 mr-3 flex-shrink-0"><span class="material-symbols-outlined text-lg">error</span></div>` : `<div class="w-8 h-8 rounded-full logo-gradient flex items-center justify-center text-white font-bold text-xs mr-3 flex-shrink-0">AI</div>`)
                : '';

            wrapper.innerHTML = `<div class="flex items-start w-full ${role === 'user' ? 'justify-end' : ''}">${avatarHtml}<div class="${bubbleStyle}"><p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</p></div></div>`;
            screen.appendChild(wrapper);
        }
        function escapeHtml(string) { return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function scrollToBottom() {
            const container = document.getElementById('chat-scroll-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }
        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;
            if (!config.apiKey) { openSettings(); alert("Please add your OpenRouter API Key in settings first!"); return; }

            input.value = '';
            document.getElementById('welcome-screen').classList.add('hidden-view');
            document.getElementById('chat-screen').classList.remove('hidden-view');

            if (!currentConvoId) { currentConvoId = 'convo_' + Date.now(); localStorage.setItem('study_ai_current_id', currentConvoId); }
            let convo = conversations.find(c => c.id === currentConvoId);
            if (!convo) { convo = { id: currentConvoId, title: query.substring(0, 24), messages: [] }; conversations.push(convo); }

            convo.messages.push({ role: 'user', content: query });
            appendMessageUI('user', query);
            scrollToBottom();
            renderSidebarHistory();

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            const screen = document.getElementById('chat-screen');
            const loaderWrapper = document.createElement('div');
            loaderWrapper.id = "ai-typing-loader";
            loaderWrapper.className = "flex justify-start items-center gap-3 py-2 text-sm text-gray-400";
            loaderWrapper.innerHTML = `<div class="w-8 h-8 rounded-full logo-gradient flex items-center justify-center text-white font-bold text-xs">AI</div><div class="flex space-x-1 items-center bg-gray-100 dark:bg-gray-800/50 px-4 py-3 rounded-2xl"><div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div><div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:150ms"></div><div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:300ms"></div></div>`;
            screen.appendChild(loaderWrapper);
            scrollToBottom();

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${config.apiKey.trim()}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "deepseek/deepseek-flash:free", messages: convo.messages.map(m => ({ role: m.role, content: m.content })) })
                });
                const data = await response.json();
                loaderWrapper.remove();
                if (response.ok && data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    convo.messages.push({ role: 'assistant', content: reply });
                    appendMessageUI('assistant', reply);
                } else {
                    let errCode = data.error ? data.error.code : response.status;
                    let errMsg = data.error ? data.error.message : "API processing error.";
                    appendMessageUI('assistant', `⚠️ System Alert: [API Error Code ${errCode}]: ${errMsg}`);
                }
            } catch (err) {
                loaderWrapper.remove();
                appendMessageUI('assistant', "⚠️ System Alert: Network Issue! Re-check your connection.");
            }
            localStorage.setItem('study_ai_convos', JSON.stringify(conversations));
            sendBtn.disabled = false;
            scrollToBottom();
        }
    </script>
</body>
</html>
