<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Ai</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        darkBg: '#131314',
                        darkSidebar: '#1e1f20',
                        geminiBlue: '#4285f4',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Gradients and Utilities */
        .gradient-text {
            background: linear-gradient(90deg, #4b90ff, #ff5546);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-gradient {
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
        }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Hide element utility */
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="bg-white text-gray-800 dark:bg-darkBg dark:text-gray-100 h-screen flex overflow-hidden transition-colors duration-200">

    <aside id="sidebar" class="w-72 bg-[#f0f4f9] dark:bg-darkSidebar h-full flex flex-col transition-all duration-300 z-20 absolute md:relative -translate-x-full md:translate-x-0">
        <div class="p-4 flex items-center justify-between">
            <button id="closeSidebarBtn" class="md:hidden p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                <span class="material-symbols-outlined">menu_open</span>
            </button>
        </div>

        <div class="px-4 mb-6">
            <button onclick="startNewChat()" class="flex items-center gap-3 bg-[#e8eef7] dark:bg-gray-800 hover:bg-[#dce4f0] dark:hover:bg-gray-700 px-4 py-3 rounded-2xl w-max transition-colors text-sm font-medium">
                <span class="material-symbols-outlined">add</span>
                New Chat
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-4">
            <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-3 px-2">Recent</p>
            <ul id="chatHistoryList" class="space-y-1">
                </ul>
        </div>

        <div class="p-4 border-t border-gray-200 dark:border-gray-700 space-y-1">
            <button onclick="toggleSettings()" class="w-full flex items-center gap-3 px-4 py-2 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg text-sm transition-colors">
                <span class="material-symbols-outlined text-[20px]">settings</span>
                Settings
            </button>
            <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-4 py-2 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg text-sm transition-colors">
                <span id="themeIcon" class="material-symbols-outlined text-[20px]">dark_mode</span>
                <span id="themeText">Dark Mode</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative w-full">
        <header class="p-4 flex items-center justify-between md:hidden absolute top-0 left-0 right-0 z-10 bg-white/80 dark:bg-darkBg/80 backdrop-blur-sm">
            <button id="openSidebarBtn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <span class="font-medium text-lg gradient-text">Study Ai</span>
            <div class="w-8"></div> </header>

        <div id="welcomeView" class="flex-1 flex flex-col items-center justify-center p-6 mt-12 md:mt-0">
            <div class="w-16 h-16 logo-gradient rounded-2xl shadow-lg mb-6 flex items-center justify-center">
                <span class="material-symbols-outlined text-white text-3xl">school</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-semibold mb-2 gradient-text text-center tracking-tight">Study Ai</h1>
            <p class="text-gray-500 dark:text-gray-400 text-lg text-center font-light">How can I help you today?</p>
        </div>

        <div id="chatView" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 hidden-view mt-12 md:mt-0 scroll-smooth pb-32">
            </div>

        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent dark:from-darkBg dark:via-darkBg pt-10">
            <div class="max-w-4xl mx-auto relative">
                <form id="chatForm" class="relative flex items-center">
                    <input type="text" id="userInput" placeholder="Ask Study Ai..." 
                        class="w-full bg-[#f0f4f9] dark:bg-[#1e1f20] text-gray-800 dark:text-gray-100 rounded-full pl-6 pr-14 py-4 focus:outline-none focus:ring-2 focus:ring-gray-300 dark:focus:ring-gray-600 shadow-sm text-md" autocomplete="off">
                    <button type="submit" id="sendBtn" class="absolute right-2 p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors flex items-center justify-center disabled:opacity-50">
                        <span class="material-symbols-outlined text-[20px]">send</span>
                    </button>
                </form>
                <div class="text-center mt-3 text-[11px] text-gray-500 dark:text-gray-400 flex flex-col items-center gap-1">
                    <span>AI can make mistakes. Check important info.</span>
                    <span class="font-medium text-gray-400 dark:text-gray-500">Created by Suhel aur Saurabh Sir</span>
                </div>
            </div>
        </div>
    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-white dark:bg-[#1e1f20] rounded-2xl p-6 w-full max-w-md shadow-2xl transform transition-all border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-semibold">Settings</h2>
                <button onclick="toggleSettings()" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">OpenRouter API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." class="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Model Name</label>
                    <input type="text" id="modelInput" placeholder="google/gemini-pro" value="google/gemini-2.5-pro" class="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 text-sm">
                    <p class="text-xs text-gray-500 mt-1">Default: google/gemini-2.5-pro</p>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="toggleSettings()" class="px-4 py-2 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors">Save Details</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const welcomeView = document.getElementById('welcomeView');
        const chatView = document.getElementById('chatView');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatHistoryList = document.getElementById('chatHistoryList');
        const sidebar = document.getElementById('sidebar');
        const settingsModal = document.getElementById('settingsModal');
        
        // State
        let chats = JSON.parse(localStorage.getItem('studyAiChats')) || [];
        let currentChatId = null;
        let config = JSON.parse(localStorage.getItem('studyAiConfig')) || {
            apiKey: '',
            model: 'google/gemini-2.5-pro'
        };

        // --- Initialization ---
        function init() {
            renderSidebar();
            checkTheme();
            
            // Populate settings inputs
            document.getElementById('apiKeyInput').value = config.apiKey;
            document.getElementById('modelInput').value = config.model;

            // Mobile Sidebar Toggle
            document.getElementById('openSidebarBtn').addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
            });
            document.getElementById('closeSidebarBtn').addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
            });
        }

        // --- Core Functions ---
        function startNewChat() {
            currentChatId = null;
            welcomeView.classList.remove('hidden-view');
            chatView.classList.add('hidden-view');
            chatView.innerHTML = '';
            userInput.value = '';
            
            // Close mobile sidebar if open
            if(window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            welcomeView.classList.add('hidden-view');
            chatView.classList.remove('hidden-view');
            chatView.innerHTML = '';

            chat.messages.forEach(msg => appendMessage(msg.role, msg.content, false));
            
            if(window.innerWidth < 768) sidebar.classList.add('-translate-x-full');
            scrollToBottom();
        }

        function renderSidebar() {
            chatHistoryList.innerHTML = '';
            // Sort by newest first
            const sortedChats = [...chats].reverse();
            
            sortedChats.forEach(chat => {
                const li = document.createElement('li');
                li.className = `px-4 py-2 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-full cursor-pointer truncate text-sm transition-colors text-gray-700 dark:text-gray-300 flex items-center gap-2`;
                li.innerHTML = `<span class="material-symbols-outlined text-[16px]">chat_bubble</span> ${chat.title}`;
                li.onclick = () => loadChat(chat.id);
                chatHistoryList.appendChild(li);
            });
        }

        function appendMessage(role, content, animate = true) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-4 max-w-3xl mx-auto w-full';
            
            if (role === 'user') {
                msgDiv.innerHTML = `
                    <div class="flex-1 flex justify-end">
                        <div class="bg-[#f0f4f9] dark:bg-[#1e1f20] px-5 py-3 rounded-2xl rounded-tr-sm text-[15px] leading-relaxed max-w-[80%]">
                            ${escapeHTML(content)}
                        </div>
                    </div>
                `;
            } else {
                // Formatting basic markdown for AI
                let formattedContent = escapeHTML(content)
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');

                msgDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full logo-gradient flex-shrink-0 flex items-center justify-center mt-1">
                        <span class="material-symbols-outlined text-white text-sm">school</span>
                    </div>
                    <div class="flex-1 pt-1 text-[15px] leading-relaxed">
                        ${formattedContent}
                    </div>
                `;
            }
            
            chatView.appendChild(msgDiv);
            scrollToBottom();
        }

        // --- Chat Submission ---
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            if (!config.apiKey) {
                alert("Please add your OpenRouter API Key in Settings first.");
                toggleSettings();
                return;
            }

            // UI Updates
            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
            
            if (!currentChatId) {
                welcomeView.classList.add('hidden-view');
                chatView.classList.remove('hidden-view');
                currentChatId = Date.now().toString();
                chats.push({ id: currentChatId, title: text.substring(0, 30) + '...', messages: [] });
                renderSidebar();
            }

            const currentChat = chats.find(c => c.id === currentChatId);
            
            // Add User message
            currentChat.messages.push({ role: 'user', content: text });
            appendMessage('user', text);

            // Add Loading Indicator for AI
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'flex gap-4 max-w-3xl mx-auto w-full animate-pulse';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 flex-shrink-0"></div>
                <div class="flex-1 space-y-2 pt-2">
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-3/4"></div>
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2"></div>
                </div>
            `;
            chatView.appendChild(loadingDiv);
            scrollToBottom();

            // Fetch AI Response
            try {
                // Prepare messages for OpenRouter (system prompt to act as Study Ai)
                const apiMessages = [
                    { role: "system", content: "You are Study Ai, an intelligent educational assistant created by Suhel and Saurabh Sir. Be helpful, concise, and friendly." },
                    ...currentChat.messages.map(m => ({ role: m.role, content: m.content }))
                ];

                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${config.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: config.model || 'google/gemini-2.5-pro',
                        messages: apiMessages
                    })
                });

                const data = await response.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const aiContent = data.choices[0].message.content;
                    currentChat.messages.push({ role: 'assistant', content: aiContent });
                    appendMessage('assistant', aiContent);
                    saveData();
                } else {
                    throw new Error("Invalid API response");
                }

            } catch (error) {
                console.error("API Error:", error);
                document.getElementById(loadingId).remove();
                appendMessage('assistant', "Sorry, I encountered an error. Please check your API key and connection.");
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">send</span>';
                userInput.focus();
            }
        });

        // --- Utilities ---
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function scrollToBottom() {
            chatView.scrollTop = chatView.scrollHeight;
        }

        function saveData() {
            localStorage.setItem('studyAiChats', JSON.stringify(chats));
        }

        // --- Settings & Theme ---
        function toggleSettings() {
            settingsModal.classList.toggle('hidden');
        }

        function saveSettings() {
            config.apiKey = document.getElementById('apiKeyInput').value.trim();
            config.model = document.getElementById('modelInput').value.trim() || 'google/gemini-2.5-pro';
            localStorage.setItem('studyAiConfig', JSON.stringify(config));
            toggleSettings();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('studyAiTheme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function checkTheme() {
            const storedTheme = localStorage.getItem('studyAiTheme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeUI(false);
            }
        }

        function updateThemeUI(isDark) {
            document.getElementById('themeIcon').textContent = isDark ? 'light_mode' : 'dark_mode';
            document.getElementById('themeText').textContent = isDark ? 'Light Mode' : 'Dark Mode';
        }

        // Run Init
        init();
    </script>
</body>
</html>
